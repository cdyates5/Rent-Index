name: Refresh A-ATRI

# Polls the data sources a few times a day and rebuilds only when an input has changed:
#   CPI rent (BLS, monthly, 08:30 ET), Zillow ZORI (monthly, mid-month), the BLS research workbook
#   (if BLS resumes it, or a copy is committed to data/), or the code itself.
# An unchanged probe run takes about 15 seconds and installs nothing.
on:
  schedule:
    - cron: "17 13 * * 1-5"   # 13:17 UTC Mon-Fri: 45 min after the 08:30 ET CPI release (US daylight time)
    - cron: "17 14 * * 1-5"   # 14:17 UTC Mon-Fri: same, US standard time
    - cron: "43 22 * * *"     # 22:43 UTC daily: catches Zillow's ZORI update and any missed release
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if no input has changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "rebuild.py"
      - "probe.py"
      - "data/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write      # commit state/ (input fingerprints, vintages, headline log)
  pages: write
  id-token: write

concurrency:
  group: atri-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      built: ${{ steps.probe.outputs.changed }}
    env:
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BLS_CONTACT_EMAIL: ${{ secrets.BLS_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check sources for new releases
        id: probe
        env:
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: python probe.py check

      - name: Install dependencies
        if: steps.probe.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild (strict sanity gate)
        if: steps.probe.outputs.changed == 'true'
        run: python rebuild.py --out site --html-name index.html --standalone --strict --archive

      - name: Headless render check
        if: steps.probe.outputs.changed == 'true'
        run: |
          python -m playwright install --with-deps chromium
          python tests/check_render.py site/index.html

      - name: Commit input fingerprints and vintage
        if: steps.probe.outputs.changed == 'true'
        run: |
          python probe.py commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "A-ATRI refresh: CPI $(python -c "import json;print(json.load(open('site/latest.json'))['asof_cpi'])"), ${{ steps.probe.outputs.reason }}"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload Pages artifact
        if: steps.probe.outputs.changed == 'true' && vars.DEPLOY_TARGET != 'artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload run artifact (artifact-only mode)
        if: steps.probe.outputs.changed == 'true' && vars.DEPLOY_TARGET == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: atri-dashboard
          path: site
          include-hidden-files: true
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo "### A-ATRI refresh"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Probe: ${{ steps.probe.outputs.reason }} (rebuild: ${{ steps.probe.outputs.changed }})"
            if [ -f site/latest.json ]; then
              python - <<'PY'
          import json
          d = json.load(open("site/latest.json"))
          n, f = d["nowcast"], d["forecast"]
          print(f"- CPI through {d['asof_cpi']}, ZORI through {d['asof_zori']}")
          print(f"- Nowcast {n['q']}: {n['yoy']:.2f}% y/y ({n['lo']:.2f} to {n['hi']:.2f})")
          print(f"- Forecast {f['q']}: {f['yoy']:.2f}% y/y")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.built == 'true' && vars.DEPLOY_TARGET != 'artifact'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
